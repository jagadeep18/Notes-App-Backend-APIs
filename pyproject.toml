[tool.poetry]
name = "notes-api"
version = "1.0.0"
description = "Production-grade multi-user Notes API"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.30"}
alembic = "^1.13.1"
asyncpg = "^0.29.0"
pydantic = {extras = ["email"], version = "^2.7.1"}
pydantic-settings = "^2.2.1"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.9"
redis = {extras = ["hiredis"], version = "^5.0.4"}
cryptography = "^42.0.7"
slowapi = "^0.1.9"
structlog = "^24.1.0"
httpx = "^0.27.0"
email-validator = "^2.1.1"
greenlet = "^3.0.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.6"
pytest-cov = "^5.0.0"
anyio = {extras = ["trio"], version = "^4.3.0"}
factory-boy = "^3.3.0"
faker = "^25.0.0"
aiosqlite = "^0.20.0"
ruff = "^0.4.4"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=app --cov-report=term-missing --cov-report=html"

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "N", "UP", "ANN", "S", "BLE", "FBT", "B", "A", "COM", "DTZ", "PIE", "RET", "SIM", "TCH", "ARG", "PTH", "ERA", "PL", "RUF"]
ignore = ["ANN101", "ANN102", "ANN401", "COM812", "ISC001"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
